name: Release Tauri

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            args: ""
          - platform: windows
            os: windows-latest
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm -F huoll-editor exec tauri build
        env:
          NEXT_PUBLIC_TAURI_BUILD: "1"

      - name: Package macOS app
        if: matrix.platform == 'macos'
        run: |
          cd next/src-tauri/target/release/bundle/macos
          tar czf huoll-editor-mac.tar.gz *.app

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            next/src-tauri/target/release/bundle/macos/*.dmg
            next/src-tauri/target/release/bundle/macos/*.tar.gz

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            next/src-tauri/target/release/bundle/nsis/*.exe
            next/src-tauri/target/release/bundle/msi/*.msi

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-bundle
          path: macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/**/*
            windows/**/*
          generate_release_notes: true
